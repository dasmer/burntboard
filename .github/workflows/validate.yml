name: Validate Burntboard

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax and app behavior
        run: npm test
